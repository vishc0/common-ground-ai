name: Bootstrap Cloudflare resources

on:
  workflow_dispatch:

jobs:
  bootstrap:
    environment: Prod
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create production D1 database
        run: npx wrangler d1 create common-ground --location enam | tee d1-create.txt
      - name: Create answer queue
        run: npx wrangler queues create common-ground-answers | tee queue-create.txt
      - name: Preserve bootstrap result
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-bootstrap-result
          path: |
            d1-create.txt
            queue-create.txt
          retention-days: 1
