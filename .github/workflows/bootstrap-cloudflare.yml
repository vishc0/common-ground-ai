name: Bootstrap Cloudflare resources

on:
  workflow_dispatch:

jobs:
  bootstrap:
    environment: Prod
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "CLOUDFLARE_API_TOKEN is missing from the Prod environment." >&2
            exit 1
          fi
          if [[ ! "${CLOUDFLARE_ACCOUNT_ID:-}" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "CLOUDFLARE_ACCOUNT_ID is invalid. Store only the Account ID, without a URL, label, spaces, or quotes." >&2
            exit 1
          fi
      - name: Verify production D1 database
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_D1_DATABASE_ID:-}"
          node -e "const fs=require('fs');const p='wrangler.jsonc';fs.writeFileSync(p,fs.readFileSync(p,'utf8').replace('REPLACE_WITH_D1_DATABASE_ID',process.env.CLOUDFLARE_D1_DATABASE_ID))"
          npx wrangler d1 info common-ground | tee d1-info.txt
      - name: Create answer queue
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler queues create common-ground-answers | tee queue-create.txt
      - name: Preserve bootstrap result
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-bootstrap-result
          path: |
            d1-info.txt
            queue-create.txt
          retention-days: 1
