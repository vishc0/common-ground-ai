name: Deploy production

on:
  workflow_dispatch:
jobs:
  deploy:
    environment: Prod
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Require provisioned resource ID
        run: test -n "$CLOUDFLARE_D1_DATABASE_ID"
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      - name: Prepare deployment configuration
        run: |
          node -e "const fs=require('fs');const p='wrangler.jsonc';fs.writeFileSync(p,fs.readFileSync(p,'utf8').replace('REPLACE_WITH_D1_DATABASE_ID',process.env.CLOUDFLARE_D1_DATABASE_ID).replace('\"APP_ENV\": \"development\"','\"APP_ENV\": \"production\"').replace('http://localhost:8787','https://common-ground-ai.blithepony131.chatgpt.site'))"
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      - run: npx wrangler d1 migrations apply common-ground --remote --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
      - run: npx wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
      - name: Install application secrets
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$SESSION_SIGNING_KEY" | npx wrangler secret put SESSION_SIGNING_KEY --config wrangler.jsonc
          printf '%s' "$INVITE_CODE_HASH" | npx wrangler secret put INVITE_CODE_HASH --config wrangler.jsonc
          if [[ -n "${TURNSTILE_SECRET_KEY:-}" ]]; then
            printf '%s' "$TURNSTILE_SECRET_KEY" | npx wrangler secret put TURNSTILE_SECRET_KEY --config wrangler.jsonc
          fi
        env:
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          SESSION_SIGNING_KEY: "${{ secrets.SESSION_SIGNING_KEY }}"
          INVITE_CODE_HASH: "${{ secrets.INVITE_CODE_HASH }}"
          TURNSTILE_SECRET_KEY: "${{ secrets.TURNSTILE_SECRET_KEY }}"
